<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TU JARDÍN</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f7f5f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        #envelope-wrapper {
            position: absolute;
            z-index: 30;
            cursor: pointer;
            text-align: center;
            transition: transform 0.3s ease, opacity 0.5s ease;
        }

        #envelope-wrapper:hover {
            transform: scale(1.05);
        }

        .envelope {
            width: 180px;
            height: 120px;
            background: #e2d7c1;
            position: relative;
            box-shadow: 0 12px 28px rgba(0,0,0,0.12);
            border-radius: 6px;
        }

        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            border-top: 65px solid #d4c7ad;
            border-left: 90px solid transparent;
            border-right: 90px solid transparent;
            z-index: 2;
        }

        .wax-seal {
            position: absolute;
            top: 48px;
            left: 75px;
            width: 30px;
            height: 30px;
            background: #9b4a4a;
            border-radius: 50%;
            z-index: 3;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e8c4c4;
            font-size: 14px;
        }

        .click-hint {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #777;
            font-style: italic;
        }

        #flower-explosion-container {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 1;
            pointer-events: none;
        }

        .burst-flower {
            position: absolute;
            font-size: 2.8rem;
            opacity: 0;
            transition: transform 3.5s cubic-bezier(0.15, 0.85, 0.35, 1), opacity 0.8s ease-in;
        }

        #main-card-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 1.2s ease, transform 1.2s ease;
            pointer-events: none;
            max-width: 90vw;
        }

        #main-card-wrapper.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .top-flowers-cluster {
            font-size: 2.2rem;
            margin-bottom: -22px;
            z-index: 15;
            position: relative;
            letter-spacing: -6px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
            user-select: none;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 35px 30px 25px 30px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.15);
            width: 320px;
            position: relative;
            z-index: 10;
            text-align: center;
            border: 1px solid #f0ece1;
        }

        .paperclip {
            position: absolute;
            top: -12px;
            right: 25px;
            width: 14px;
            height: 38px;
            border: 2px solid #b0b0b0;
            border-radius: 8px;
            background: transparent;
            z-index: 12;
        }

        h1 {
            font-style: italic;
            font-size: 1.7rem;
            font-weight: bold;
            color: #2b2b2b;
            margin-top: 10px;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: #a09a90;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .info-row {
            text-align: left;
            font-size: 0.95rem;
            color: #444;
            margin-bottom: 8px;
        }

        .message-box {
            margin: 20px 0 15px 0;
            padding: 15px;
            background-color: #faf8f5;
            border-left: 3px solid #d98880;
            border-radius: 4px;
            text-align: left;
            font-size: 0.92rem;
            line-height: 1.5;
            color: #4a4a4a;
            font-style: italic;
        }

        .action-icon {
            width: 36px;
            height: 36px;
            background: #636363;
            color: white;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0 5px 0;
            font-size: 1rem;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        }

        .bottom-stems {
            width: 140px;
            height: 90px;
            margin-top: -10px;
            z-index: 5;
            position: relative;
        }

        .repeat-btn {
            margin-top: 20px;
            background: #ffffff;
            border: 1px solid #d1c9b8;
            padding: 8px 18px;
            border-radius: 20px;
            color: #666;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            font-family: inherit;
        }

        .repeat-btn:hover {
            background: #f0ece1;
            color: #333;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div id="envelope-wrapper" onclick="abrirRegalo()">
        <div class="envelope">
            <div class="wax-seal">❦</div>
        </div>
        <div class="click-hint">Toca para abrir</div>
    </div>

    <div id="flower-explosion-container"></div>

    <div id="main-card-wrapper">
        <div class="top-flowers-cluster">
            🌸🌺🌹🌻🪷🌸
        </div>

        <div class="card">
            <div class="paperclip"></div>
            <h1>TU JARDÍN</h1>
            <div class="subtitle">CON AMOR</div>

            <div class="info-row"><strong>Para:</strong> Mi princesita</div>
            <div class="info-row"><strong>De:</strong> Tu niño</div>

            <div class="message-box">
                "Amor mío, disculpa por lo de esta mañana, sé que no cambia nada pero tampoco he podido estar tranquilo. Te amo." 🤍
            </div>

            <div class="action-icon">↓</div>
        </div>

        <svg class="bottom-stems" viewBox="0 0 100 80">
            <path d="M 30,0 L 45,70" stroke="#7a9a60" stroke-width="3" stroke-linecap="round"/>
            <path d="M 42,0 L 48,75" stroke="#688750" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M 50,0 L 50,78" stroke="#5b7843" stroke-width="4" stroke-linecap="round"/>
            <path d="M 58,0 L 52,75" stroke="#688750" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M 70,0 L 55,70" stroke="#7a9a60" stroke-width="3" stroke-linecap="round"/>
            <path d="M 38,45 C 45,40 55,40 62,45 C 55,50 45,50 38,45 Z" fill="#9db588"/>
        </svg>

        <button class="repeat-btn" onclick="reiniciarTodo()">↻ Repetir animación</button>
    </div>

    <script>
        const envelopeWrapper = document.getElementById('envelope-wrapper');
        const explosionContainer = document.getElementById('flower-explosion-container');
        const mainCardWrapper = document.getElementById('main-card-wrapper');

        const flowerIcons = ['🌸', '🌺', '🌻', '🌼', '🌷', '🌹', '🪷', '🏵️'];

        function abrirRegalo() {
            envelopeWrapper.style.opacity = '0';
            envelopeWrapper.style.pointerEvents = 'none';

            setTimeout(() => {
                envelopeWrapper.style.display = 'none';
                generarExplosionFlores();
            }, 100);
        }

        function generarExplosionFlores() {
            explosionContainer.innerHTML = '';
            explosionContainer.style.display = 'block';

            const totalFlores = 250;

            for (let i = 0; i < totalFlores; i++) {
                const flower = document.createElement('div');
                flower.classList.add('burst-flower');
                flower.innerText = flowerIcons[Math.floor(Math.random() * flowerIcons.length)];

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * (Math.max(window.innerWidth, window.innerHeight) * 0.8);

                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                const rot = Math.random() * 720 - 360;
                const scale = Math.random() * 1.5 + 0.6;

                explosionContainer.appendChild(flower);

                void flower.offsetWidth;

                flower.style.transform = `translate(${tx}px, ${ty}px) rotate(${rot}deg) scale(${scale})`;
                flower.style.opacity = '0.75'; 
            }

            setTimeout(() => {
                mainCardWrapper.classList.add('visible');
            }, 2000); 
        }

        function reiniciarTodo() {
            mainCardWrapper.classList.remove('visible');

            setTimeout(() => {
                explosionContainer.innerHTML = '';
                envelopeWrapper.style.display = 'block';

                setTimeout(() => {
                    envelopeWrapper.style.opacity = '1';
                    envelopeWrapper.style.pointerEvents = 'auto';
                }, 50);
            }, 1000);
        }
    </script>
</body>
</html>
